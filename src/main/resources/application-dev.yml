spring:
  datasource:
    url: jdbc:mariadb://ec2-43-202-60-141.ap-northeast-2.compute.amazonaws.com:3306/crawling_db
    username: root
    password: root
    driver-class-name: org.mariadb.jdbc.Driver

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]"
  level:
    web: INFO

server:
  port: 8080

webdriver:
  chrome:
    path: /usr/local/bin/chromedriver

scheduler:
  cron:
    crawling: 0 0 8-19 * * MON-FRI # 월-금 8시부터 19시까지 매시간 정각에 실행
